appId: dev.speccraft.app
productName: SpecCraft
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  target: [AppImage, deb]
publish: null
