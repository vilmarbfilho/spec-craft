appId: dev.speccraft.app
productName: SpecCraft
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
icon: build/icon.png
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  target: [AppImage, deb]
  maintainer: Vilmar Bispo Filho <vilmarbf.ads@gmail.com>
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: vilmarbfilho
  repo: spec-craft
  releaseType: draft
